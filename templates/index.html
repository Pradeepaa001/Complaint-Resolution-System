{% extends "base.html" %}
{% block title %}Submit a Complaint{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3">Submit a Complaint</h4>
        <form action="{{ url_for('submit_complaint') }}" method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" name="category" required>
              <option value="" disabled selected>Select a category</option>
              {% for c in categories %}
                <option value="{{ c }}">{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="4" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Attachment (optional)</label>
            <input type="file" class="form-control" name="attachment">
            <div class="form-text">Stored in S3. Allowed: png, jpg, jpeg, pdf, docx, txt</div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Submit Complaint</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
